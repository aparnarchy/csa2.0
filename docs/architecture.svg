  <text x="84" y="2392" font-size="12.5" fill="#64748b">Stack: Next.js (App Router) mobile-first PWA · Cloudflare Pages + Workers + D1 · Wrangler deploy · email/password auth · Gemini Flash AI · polling.</text>
  <text x="84" y="2416" font-size="12.5" fill="#64748b">Firebase was dropped (org-blocked). Real-time sync uses short-interval polling. App-store apps are out of pilot scope.</text>
