  <!-- Key rules -->
  <text x="60" y="2074" font-size="15" font-weight="bold" fill="#334155">KEY RULES</text>
  <g font-size="13" fill="#475569">
    <text x="60" y="2102">• Anonymisation floor: manager sees nothing below 3 responses (team also needs ≥ 3 reportees).</text>
    <text x="60" y="2128">• Manager action delay: employees see a manager's action 4 weeks after it is submitted.</text>
    <text x="60" y="2154">• Low-score threshold &lt; 7 triggers a recommendation. Retrospective answers score but don't count toward streak.</text>
    <text x="60" y="2180">• All data anonymised to managers — aggregates only, never individual scores. Privacy enforced in server code.</text>
    <text x="60" y="2206">• Delivered as an installable PWA (Add to Home Screen). Capacitor is the post-pilot path to app stores.</text>
  </g>

